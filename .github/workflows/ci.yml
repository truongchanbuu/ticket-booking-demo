name: CI/CD Pipeline
on:
  push:
    branches:
      - main
      - staging

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ticket_service: ${{ steps.filter.outputs.ticket_service }}
      event_service: ${{ steps.filter.outputs.event_service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Check for file changes
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            ticket_service:
              - 'ticket-service/**'
            event_service:
              - 'event-service/**'

  build-and-deploy-ticket:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.ticket_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        
      - name: Debug info
        run: |
          echo "Building ticket service from branch: ${{ env.BRANCH_NAME }}"
          echo "Changes detected in ticket-service folder"

      - name: Build and Push Ticket Service
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/event-booking/ticket-service:latest -t ghcr.io/${{ secrets.GHCR_USERNAME }}/event-booking/ticket-service:${{ env.BRANCH_NAME }} ./ticket-service
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/event-booking/ticket-service:latest
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/event-booking/ticket-service:${{ env.BRANCH_NAME }}

  build-and-deploy-event:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.event_service == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
        
      - name: Debug info
        run: |
          echo "Building event service from branch: ${{ env.BRANCH_NAME }}"
          echo "Changes detected in event-service folder"

      - name: Build and Push Event Service
        run: |
          docker build -t ghcr.io/${{ secrets.G
